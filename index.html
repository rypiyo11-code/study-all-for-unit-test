<style>
  :root{

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#1c1a17; --panel:#242220; --ink:#eae6dd; --sub:#a49c8c; --line:#3a352c; }

  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:Inter, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    padding: calc(14px + env(safe-area-inset-top,0px)) 20px 12px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  header h1{ margin:0 0 10px; font-size:1.15rem; }
  .tabs{ display:flex; gap:8px; }
  .tabs button{
    font:inherit; font-size:.92rem; padding:8px 18px; border-radius:999px;
    border:1px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer;
  }
  .tabs button.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .frames{ flex:1; position:relative; }
  iframe{
    position:absolute; inset:0; width:100%; height:100%; border:0;
    background:var(--panel); display:none;
  }
  iframe.active{ display:block; }
</style>
